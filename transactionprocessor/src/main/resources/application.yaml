spring:
  application:
    name: transactionprocessor
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:250MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:txp}}
    username: ${DB_USERNAME:txp}
    password: ${DB_PASSWORD:txp}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  statement-upload-directory: ${STATEMENT_UPLOAD_DIRECTORY:/app/data/statements}
  upload-max-file-size: ${UPLOAD_MAX_FILE_SIZE_BYTES:52428800}
  synthetic-timestamp-step-minutes: ${SYNTHETIC_TIMESTAMP_STEP_MINUTES:3}
  tng-password: ${TNG_PDF_PASSWORD:}
  ocr-enabled: ${OCR_ENABLED:false}

logging:
  level:
    com.transactionprocessor: INFO
