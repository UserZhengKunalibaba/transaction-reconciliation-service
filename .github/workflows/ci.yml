name: Java CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transactionprocessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: transactionprocessor/pom.xml
      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test
